name: Publish

# Build and deploy the site on pushes to master, and on a schedule.
on:
  push:
    branches: [ master ]
  schedule:
    - cron: '45 05,11,17,23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    # Installs the tools pinned in mise.toml (Hugo).
    - uses: jdx/mise-action@v4

    - name: Build site
      env:
        HUGO_ENV: production
        HUGO_ENVIRONMENT: production
      run: mise exec -- hugo --gc --minify --environment production

    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: public
